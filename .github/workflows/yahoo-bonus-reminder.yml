name: Yahoo BONUS+ 日程更新リマインダー

on:
  schedule:
    # 毎月1日 9:00 JST (0:00 UTC)
    - cron: '0 0 1 * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  create-reminder-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 翌月のBONUS+日程更新Issueを作成
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            const year = nextMonth.getFullYear();
            const month = nextMonth.getMonth() + 1;

            const title = `[月次作業] ${year}年${month}月 Yahoo! BONUS+優良ストア 日程更新`;

            const body = `## 毎月の更新作業

            Yahoo!ショッピングの **BONUS+優良ストア** 日程を翌月分に更新してください。

            ### 手順

            1. Yahoo!ショッピングで${year}年${month}月のBONUS+日程を確認する
               - [Yahoo!ショッピング キャンペーンカレンダー](https://shopping.yahoo.co.jp/promotion/campaign/dailybonus/calendar/)（要ログイン）
               - または検索: \`Yahoo ショッピング BONUS+ ${year}年${month}月\`

            2. \`src/App.jsx\` の \`YAHOO_BONUS_PLUS_DATES\` 配列に日付を追加する

            \`\`\`js
            // 例: ${year}年${month}月分を追加
            const YAHOO_BONUS_PLUS_DATES = [
              // ... 既存の日付 ...
              '${year}-${String(month).padStart(2, '0')}-XX', // BONUS+優良ストア
            ];
            \`\`\`

            3. コミット・プッシュして完了

            ### 自動算出済み（更新不要）
            - 5のつく日（毎月5・15・25日）
            - ファーストデイ（毎月1日）
            - ヤフショ感謝デー（毎月11・22日）
            - プレミアムな日曜日（毎週日曜）

            ---
            *このIssueは GitHub Actions により自動作成されました*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['monthly-update'],
            });
